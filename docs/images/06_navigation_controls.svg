<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr-n6" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#7c5cff"/>
    </marker>
    <marker id="arr-sub" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#9a9ab0"/>
    </marker>
  </defs>
  <rect width="720" height="600" fill="#ffffff"/>

  <rect x="40" y="40" width="160" height="48" rx="8" fill="#f0ebff" stroke="#7c5cff" stroke-width="2"/>
  <text x="120" y="62" text-anchor="middle" font-size="12" font-weight="680" fill="#1a1a2e">FrmLogin</text>
  <text x="120" y="78" text-anchor="middle" font-size="11" fill="#6b6b80">登录 · 软键盘 · DialogResult.OK</text>

  <path d="M 200 64 L 260 64" fill="none" stroke="#7c5cff" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-n6)"/>

  <rect x="260" y="40" width="200" height="48" rx="8" fill="#7c5cff" stroke="#7c5cff" stroke-width="2"/>
  <text x="360" y="62" text-anchor="middle" font-size="12" font-weight="680" fill="#ffffff">FrmMain (导航中枢)</text>
  <text x="360" y="78" text-anchor="middle" font-size="11" fill="#f0ebff">storeTimer · 通信线程 · OpenForm</text>

  <text x="20" y="124" font-size="11" fill="#6b6b80" font-weight="680">NaviButton 切换 (SetNaviButtonSelected)</text>

  <rect x="20" y="140" width="108" height="74" rx="8" fill="#e6fffa" stroke="#00a3a3" stroke-width="1.5"/>
  <text x="74" y="160" text-anchor="middle" font-size="12" font-weight="680" fill="#1a1a2e">集中监控</text>
  <text x="74" y="176" text-anchor="middle" font-size="11" fill="#6b6b80">FrmMonitor</text>
  <text x="74" y="192" text-anchor="middle" font-size="11" fill="#6b6b80">THMControl×6</text>
  <text x="74" y="208" text-anchor="middle" font-size="11" fill="#00a3a3" font-weight="600">无需权限</text>

  <rect x="136" y="140" width="108" height="74" rx="8" fill="#ffffff" stroke="#e4e4ec" stroke-width="1.5"/>
  <text x="190" y="160" text-anchor="middle" font-size="12" font-weight="680" fill="#1a1a2e">参数设置</text>
  <text x="190" y="176" text-anchor="middle" font-size="11" fill="#6b6b80">FrmParamSet</text>
  <text x="190" y="192" text-anchor="middle" font-size="11" fill="#6b6b80">TextSet+LED</text>
  <text x="190" y="208" text-anchor="middle" font-size="11" fill="#e07a3c" font-weight="600">需 ParamSet</text>

  <rect x="252" y="140" width="108" height="74" rx="8" fill="#ffffff" stroke="#e4e4ec" stroke-width="1.5"/>
  <text x="306" y="160" text-anchor="middle" font-size="12" font-weight="680" fill="#1a1a2e">配方管理</text>
  <text x="306" y="176" text-anchor="middle" font-size="11" fill="#6b6b80">FrmRecipe</text>
  <text x="306" y="192" text-anchor="middle" font-size="11" fill="#6b6b80">RecipeControl×6</text>
  <text x="306" y="208" text-anchor="middle" font-size="11" fill="#e07a3c" font-weight="600">需 Recipe</text>

  <rect x="368" y="140" width="108" height="74" rx="8" fill="#ffffff" stroke="#e4e4ec" stroke-width="1.5"/>
  <text x="422" y="160" text-anchor="middle" font-size="12" font-weight="680" fill="#1a1a2e">报警追溯</text>
  <text x="422" y="176" text-anchor="middle" font-size="11" fill="#6b6b80">FrmAlarm</text>
  <text x="422" y="192" text-anchor="middle" font-size="11" fill="#6b6b80">DataGridView</text>
  <text x="422" y="208" text-anchor="middle" font-size="11" fill="#e07a3c" font-weight="600">需 HistoryLog</text>

  <rect x="484" y="140" width="108" height="74" rx="8" fill="#ffffff" stroke="#e4e4ec" stroke-width="1.5"/>
  <text x="538" y="160" text-anchor="middle" font-size="12" font-weight="680" fill="#1a1a2e">历史趋势</text>
  <text x="538" y="176" text-anchor="middle" font-size="11" fill="#6b6b80">FrmHistory</text>
  <text x="538" y="192" text-anchor="middle" font-size="11" fill="#6b6b80">StripChartX</text>
  <text x="538" y="208" text-anchor="middle" font-size="11" fill="#e07a3c" font-weight="600">需 HistoryTrend</text>

  <rect x="600" y="140" width="108" height="74" rx="8" fill="#ffffff" stroke="#e4e4ec" stroke-width="1.5"/>
  <text x="654" y="160" text-anchor="middle" font-size="12" font-weight="680" fill="#1a1a2e">用户管理</text>
  <text x="654" y="176" text-anchor="middle" font-size="11" fill="#6b6b80">FrmUserManage</text>
  <text x="654" y="192" text-anchor="middle" font-size="11" fill="#6b6b80">DataGridView</text>
  <text x="654" y="208" text-anchor="middle" font-size="11" fill="#e07a3c" font-weight="600">需 UserManage</text>

  <path d="M 300 88 Q 200 110 74 140" fill="none" stroke="#7c5cff" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr-n6)"/>
  <path d="M 330 88 Q 280 110 190 140" fill="none" stroke="#7c5cff" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr-n6)"/>
  <path d="M 360 88 L 306 140" fill="none" stroke="#7c5cff" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr-n6)"/>
  <path d="M 390 88 Q 410 110 422 140" fill="none" stroke="#7c5cff" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr-n6)"/>
  <path d="M 410 88 Q 480 110 538 140" fill="none" stroke="#7c5cff" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr-n6)"/>
  <path d="M 420 88 Q 540 110 654 140" fill="none" stroke="#7c5cff" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr-n6)"/>

  <text x="20" y="248" font-size="11" fill="#6b6b80" font-weight="680">FrmParamSet 弹出的子窗体 (ShowDialog)</text>

  <rect x="60" y="264" width="150" height="56" rx="8" fill="#f7f7fb" stroke="#e4e4ec" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="135" y="286" text-anchor="middle" font-size="12" font-weight="680" fill="#1a1a2e">FrmModify</text>
  <text x="135" y="304" text-anchor="middle" font-size="11" fill="#6b6b80">修改单变量值 · CommonWrite</text>

  <rect x="230" y="264" width="150" height="56" rx="8" fill="#f7f7fb" stroke="#e4e4ec" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="305" y="286" text-anchor="middle" font-size="12" font-weight="680" fill="#1a1a2e">FrmGroupConfig</text>
  <text x="305" y="304" text-anchor="middle" font-size="11" fill="#6b6b80">通讯组 CRUD · Group.xlsx</text>

  <rect x="400" y="264" width="150" height="56" rx="8" fill="#f7f7fb" stroke="#e4e4ec" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="475" y="286" text-anchor="middle" font-size="12" font-weight="680" fill="#1a1a2e">FrmVariableConfig</text>
  <text x="475" y="304" text-anchor="middle" font-size="11" fill="#6b6b80">变量 CRUD · Variable.xlsx</text>

  <path d="M 190 214 Q 150 235 135 264" fill="none" stroke="#9a9ab0" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="3 3" marker-end="url(#arr-sub)"/>
  <path d="M 190 214 Q 260 235 305 264" fill="none" stroke="#9a9ab0" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="3 3" marker-end="url(#arr-sub)"/>
  <path d="M 190 214 Q 360 235 475 264" fill="none" stroke="#9a9ab0" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="3 3" marker-end="url(#arr-sub)"/>

  <text x="20" y="356" font-size="11" fill="#6b6b80" font-weight="680">全局消息框 (所有窗体共用)</text>

  <rect x="100" y="372" width="240" height="60" rx="8" fill="#fff3ea" stroke="#e07a3c" stroke-width="1.2"/>
  <text x="220" y="394" text-anchor="middle" font-size="12" font-weight="680" fill="#1a1a2e">FrmMsgBoxWithAck</text>
  <text x="220" y="412" text-anchor="middle" font-size="11" fill="#6b6b80">ShowDialog 模态 · 返回 OK/Cancel</text>
  <text x="220" y="426" text-anchor="middle" font-size="11" fill="#6b6b80">用于: 删除确认 / 打开文件询问</text>

  <rect x="380" y="372" width="240" height="60" rx="8" fill="#fff3ea" stroke="#e07a3c" stroke-width="1.2"/>
  <text x="500" y="394" text-anchor="middle" font-size="12" font-weight="680" fill="#1a1a2e">FrmMsgBoxWithoutAck</text>
  <text x="500" y="412" text-anchor="middle" font-size="11" fill="#6b6b80">Show 非模态 · 仅提示</text>
  <text x="500" y="426" text-anchor="middle" font-size="11" fill="#6b6b80">用于: 校验失败 / 操作成功提示</text>

  <rect x="20" y="456" width="680" height="120" rx="8" fill="#f7f7fb" stroke="#e4e4ec" stroke-width="1"/>
  <text x="36" y="478" font-size="12" font-weight="680" fill="#1a1a2e">关键设计要点</text>
  <text x="36" y="498" font-size="11" fill="#6b6b80">• 页面切换用 OpenForm: 固定窗体(集中监控)仅隐藏, 非固定窗体每次关闭释放</text>
  <text x="36" y="516" font-size="11" fill="#6b6b80">• AddLog 委托延迟赋值: FrmMain_Load 必须先开监控窗再加载设备 (否则日志丢失)</text>
  <text x="36" y="534" font-size="11" fill="#6b6b80">• 通信参数热更新: 改 IP/端口后写 INI + IsConnected=false, 通信线程自动重连</text>
  <text x="36" y="552" font-size="11" fill="#6b6b80">• 左右切换按钮: btn_Left/Right 增减 CurrentIndex 触发 CommonNaviButton_Click</text>
  <text x="36" y="570" font-size="11" fill="#6b6b80">• WS_EX_COMPOSITED 双缓冲 (CreateParams) 减少导航切换闪烁</text>
</svg>