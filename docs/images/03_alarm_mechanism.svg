<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr-a3" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#7c5cff"/>
    </marker>
  </defs>
  <rect width="720" height="600" fill="#ffffff"/>

  <text x="40" y="40" font-size="13" font-weight="680" fill="#1a1a2e">变量命名约定 (4 变量一族)</text>

  <rect x="40" y="56" width="280" height="44" rx="8" fill="#ffffff" stroke="#e4e4ec" stroke-width="1.5"/>
  <text x="56" y="76" font-size="12" font-weight="540" fill="#1a1a2e">模块1温度</text>
  <text x="56" y="92" font-size="11" fill="#6b6b80">当前值 · 数值 (float)</text>
  <text x="300" y="82" text-anchor="end" font-size="11" fill="#00a3a3">读取</text>

  <rect x="40" y="110" width="280" height="44" rx="8" fill="#fff3ea" stroke="#e07a3c" stroke-width="1.5"/>
  <text x="56" y="130" font-size="12" font-weight="540" fill="#1a1a2e">模块1温度高</text>
  <text x="56" y="146" font-size="11" fill="#6b6b80">报警标志 · bool · 从站上报(锁存)</text>
  <text x="300" y="136" text-anchor="end" font-size="11" fill="#e07a3c">不可靠</text>

  <rect x="40" y="164" width="280" height="44" rx="8" fill="#f0ebff" stroke="#7c5cff" stroke-width="1.5"/>
  <text x="56" y="184" font-size="12" font-weight="540" fill="#1a1a2e">模块1温度高限</text>
  <text x="56" y="200" font-size="11" fill="#6b6b80">限值 · 数值 · 遍历目标</text>
  <text x="300" y="190" text-anchor="end" font-size="11" fill="#7c5cff">★ 入口</text>

  <rect x="40" y="218" width="280" height="44" rx="8" fill="#ffffff" stroke="#e4e4ec" stroke-width="1.5"/>
  <text x="56" y="238" font-size="12" font-weight="540" fill="#1a1a2e">模块1温度报警启用</text>
  <text x="56" y="254" font-size="11" fill="#6b6b80">启用开关 · bool ("1"=开)</text>
  <text x="300" y="248" text-anchor="end" font-size="11" fill="#00a3a3">读取</text>

  <rect x="40" y="284" width="280" height="80" rx="8" fill="#f7f7fb" stroke="#e4e4ec" stroke-width="1.5"/>
  <text x="56" y="304" font-size="12" font-weight="540" fill="#1a1a2e">推导规则 (从限值名)</text>
  <text x="56" y="324" font-size="12" fill="#00a3a3" font-family="'Cascadia Code', Consolas, monospace">当前值 = 去"高限"/"低限"</text>
  <text x="56" y="342" font-size="12" fill="#00a3a3" font-family="'Cascadia Code', Consolas, monospace">报警标志 = 去"限"</text>
  <text x="56" y="360" font-size="12" fill="#00a3a3" font-family="'Cascadia Code', Consolas, monospace">启用开关 = 当前值 + "报警启用"</text>

  <text x="380" y="40" font-size="13" font-weight="680" fill="#1a1a2e">CheckAlarms 算法流程</text>

  <rect x="380" y="56" width="300" height="44" rx="8" fill="#f7f7fb" stroke="#e4e4ec" stroke-width="1.5"/>
  <text x="396" y="76" font-size="12" font-weight="540" fill="#1a1a2e">① 遍历所有 "*高限" / "*低限" 变量</text>
  <text x="396" y="92" font-size="11" fill="#6b6b80">跳过非限值变量</text>

  <rect x="380" y="116" width="300" height="44" rx="8" fill="#f7f7fb" stroke="#e4e4ec" stroke-width="1.5"/>
  <text x="396" y="136" font-size="12" font-weight="540" fill="#1a1a2e">② 按推导规则查 3 个相关变量</text>
  <text x="396" y="152" font-size="11" fill="#6b6b80">FindVariable(name) 定位</text>

  <rect x="380" y="176" width="300" height="80" rx="8" fill="#f7f7fb" stroke="#e4e4ec" stroke-width="1.5"/>
  <text x="396" y="196" font-size="12" font-weight="540" fill="#1a1a2e">③ 三来源读取</text>
  <text x="396" y="216" font-size="12" fill="#00a3a3" font-family="'Cascadia Code', Consolas, monospace">alarmEnabled = 启用=="1"</text>
  <text x="396" y="234" font-size="12" fill="#00a3a3" font-family="'Cascadia Code', Consolas, monospace">current = float(当前值)</text>
  <text x="396" y="252" font-size="12" fill="#00a3a3" font-family="'Cascadia Code', Consolas, monospace">limit = float(限值)</text>

  <rect x="380" y="272" width="300" height="64" rx="8" fill="#f7f7fb" stroke="#e4e4ec" stroke-width="1.5"/>
  <text x="396" y="292" font-size="12" font-weight="540" fill="#1a1a2e">④ 本地比较 (优先于从站标志)</text>
  <text x="396" y="312" font-size="12" fill="#00a3a3" font-family="'Cascadia Code', Consolas, monospace">高报: current &gt; limit</text>
  <text x="396" y="330" font-size="12" fill="#00a3a3" font-family="'Cascadia Code', Consolas, monospace">低报: current &lt; limit</text>

  <rect x="380" y="352" width="300" height="50" rx="8" fill="#f7f7fb" stroke="#e4e4ec" stroke-width="1.5"/>
  <text x="396" y="372" font-size="12" font-weight="540" fill="#1a1a2e">⑤ 综合判定</text>
  <text x="396" y="392" font-size="12" fill="#00a3a3" font-family="'Cascadia Code', Consolas, monospace">newState = alarmEnabled &amp;&amp; local</text>

  <rect x="380" y="420" width="300" height="64" rx="8" fill="#fff3ea" stroke="#e07a3c" stroke-width="1.5"/>
  <text x="396" y="440" font-size="12" font-weight="540" fill="#1a1a2e">⑥ 锁存跳变检测 (核心)</text>
  <text x="396" y="460" font-size="12" fill="#00a3a3" font-family="'Cascadia Code', Consolas, monospace">if newState != lastState[name]</text>
  <text x="396" y="478" font-size="11" fill="#6b6b80">仅跳变时触发, 避免每秒重复报警</text>

  <rect x="380" y="500" width="300" height="50" rx="8" fill="#f0ebff" stroke="#7c5cff" stroke-width="1.5"/>
  <text x="396" y="520" font-size="12" font-weight="540" fill="#1a1a2e">⑦ Device.RaiseAlarm(state, var)</text>
  <text x="396" y="540" font-size="11" fill="#6b6b80">→ 触发三路输出 (日志/DB/滚动)</text>

  <path d="M 530 100 L 530 116" fill="none" stroke="#7c5cff" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-a3)"/>
  <path d="M 530 160 L 530 176" fill="none" stroke="#7c5cff" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-a3)"/>
  <path d="M 530 256 L 530 272" fill="none" stroke="#7c5cff" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-a3)"/>
  <path d="M 530 336 L 530 352" fill="none" stroke="#7c5cff" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-a3)"/>
  <path d="M 530 402 L 530 420" fill="none" stroke="#7c5cff" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-a3)"/>
  <path d="M 530 484 L 530 500" fill="none" stroke="#7c5cff" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-a3)"/>

  <path d="M 320 200 Q 360 200 380 138" fill="none" stroke="#9a9ab0" stroke-width="1.2" stroke-dasharray="3 3"/>

  <text x="360" y="580" text-anchor="middle" font-size="11" fill="#6b6b80">从站报警位具有锁存特性(温度恢复后不自动清零), 故采用本地数值比较作为可靠依据</text>
</svg>