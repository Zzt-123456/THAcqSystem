<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr-b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#7c5cff"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#00a3a3"/>
    </marker>
    <marker id="arr-n" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#9a9ab0"/>
    </marker>
  </defs>
  <rect width="720" height="580" fill="#ffffff"/>

  <text x="130" y="32" text-anchor="middle" font-size="13" font-weight="680" fill="#1a1a2e">① 后台通信线程</text>
  <text x="130" y="48" text-anchor="middle" font-size="11" fill="#6b6b80">Task.Run · while(!cts.Cancel)</text>
  <text x="360" y="32" text-anchor="middle" font-size="13" font-weight="680" fill="#7c5cff">② 共享数据桥梁</text>
  <text x="360" y="48" text-anchor="middle" font-size="11" fill="#6b6b80">Device.CurrentValue Dictionary</text>
  <text x="590" y="32" text-anchor="middle" font-size="13" font-weight="680" fill="#1a1a2e">③ storeTimer 心跳 (1秒)</text>
  <text x="590" y="48" text-anchor="middle" font-size="11" fill="#6b6b80">System.Timers.Timer · 线程池</text>

  <rect x="40" y="70" width="180" height="50" rx="8" fill="#f0ebff" stroke="#7c5cff" stroke-width="1.5"/>
  <text x="130" y="92" text-anchor="middle" font-size="12" font-weight="540" fill="#1a1a2e">Modbus 批量读取</text>
  <text x="130" y="108" text-anchor="middle" font-size="11" fill="#6b6b80">ReadOutputRegisters 等 4 类</text>

  <rect x="40" y="150" width="180" height="50" rx="8" fill="#f0ebff" stroke="#7c5cff" stroke-width="1.5"/>
  <text x="130" y="172" text-anchor="middle" font-size="12" font-weight="540" fill="#1a1a2e">字节序解析 + 线性转换</text>
  <text x="130" y="188" text-anchor="middle" font-size="11" fill="#6b6b80">实际值 = 原始×Scale+Offset</text>

  <rect x="40" y="230" width="180" height="50" rx="8" fill="#f0ebff" stroke="#7c5cff" stroke-width="1.5"/>
  <text x="130" y="252" text-anchor="middle" font-size="12" font-weight="540" fill="#1a1a2e">device.UpdateVariable()</text>
  <text x="130" y="268" text-anchor="middle" font-size="11" fill="#6b6b80">写字典 · 不触 UI</text>

  <path d="M 130 120 L 130 150" fill="none" stroke="#7c5cff" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-b)"/>
  <path d="M 130 200 L 130 230" fill="none" stroke="#7c5cff" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-b)"/>

  <rect x="270" y="130" width="180" height="100" rx="8" fill="#f7f7fb" stroke="#7c5cff" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="360" y="160" text-anchor="middle" font-size="12" font-weight="680" fill="#7c5cff">Device["模块1温度"]</text>
  <text x="360" y="180" text-anchor="middle" font-size="11" fill="#6b6b80">变量名 → 实时值</text>
  <text x="360" y="200" text-anchor="middle" font-size="11" fill="#6b6b80">string / float / bool</text>
  <text x="360" y="220" text-anchor="middle" font-size="11" fill="#6b6b80">6 站点 × 12 变量</text>

  <path d="M 220 255 Q 250 240 270 200" fill="none" stroke="#7c5cff" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-b)"/>

  <rect x="500" y="70" width="180" height="50" rx="8" fill="#e6fffa" stroke="#00a3a3" stroke-width="1.5"/>
  <text x="590" y="92" text-anchor="middle" font-size="12" font-weight="540" fill="#1a1a2e">UI 刷新 (Invoke)</text>
  <text x="590" y="108" text-anchor="middle" font-size="11" fill="#6b6b80">时间 / 通信灯 LED</text>

  <rect x="500" y="150" width="180" height="50" rx="8" fill="#e6fffa" stroke="#00a3a3" stroke-width="1.5"/>
  <text x="590" y="172" text-anchor="middle" font-size="12" font-weight="540" fill="#1a1a2e">报警检测 CheckAlarms</text>
  <text x="590" y="188" text-anchor="middle" font-size="11" fill="#6b6b80">本地限值比较 · 锁存跳变</text>

  <rect x="500" y="230" width="180" height="50" rx="8" fill="#e6fffa" stroke="#00a3a3" stroke-width="1.5"/>
  <text x="590" y="252" text-anchor="middle" font-size="12" font-weight="540" fill="#1a1a2e">数据库存储</text>
  <text x="590" y="268" text-anchor="middle" font-size="11" fill="#6b6b80">AddActualData (12字段)</text>

  <path d="M 450 160 Q 475 130 500 95" fill="none" stroke="#00a3a3" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-a)"/>
  <path d="M 450 180 L 500 175" fill="none" stroke="#00a3a3" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-a)"/>
  <path d="M 450 200 Q 475 225 500 255" fill="none" stroke="#00a3a3" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-a)"/>

  <rect x="270" y="330" width="180" height="46" rx="8" fill="#f0ebff" stroke="#7c5cff" stroke-width="1.5"/>
  <text x="360" y="350" text-anchor="middle" font-size="12" font-weight="540" fill="#1a1a2e">Device.RaiseAlarm</text>
  <text x="360" y="366" text-anchor="middle" font-size="11" fill="#6b6b80">仅状态跳变时触发</text>

  <path d="M 590 200 Q 560 260 450 353" fill="none" stroke="#7c5cff" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-b)"/>

  <rect x="60" y="420" width="180" height="56" rx="8" fill="#ffffff" stroke="#e4e4ec" stroke-width="1.5"/>
  <text x="150" y="442" text-anchor="middle" font-size="12" font-weight="540" fill="#1a1a2e">AddLog → FrmMonitor</text>
  <text x="150" y="460" text-anchor="middle" font-size="11" fill="#6b6b80">ListView 日志列表</text>

  <rect x="270" y="420" width="180" height="56" rx="8" fill="#ffffff" stroke="#e4e4ec" stroke-width="1.5"/>
  <text x="360" y="442" text-anchor="middle" font-size="12" font-weight="540" fill="#1a1a2e">sysLogManage.AddSysLog</text>
  <text x="360" y="460" text-anchor="middle" font-size="11" fill="#6b6b80">SysLog 表 (触发/消除)</text>

  <rect x="480" y="420" width="180" height="56" rx="8" fill="#ffffff" stroke="#e4e4ec" stroke-width="1.5"/>
  <text x="570" y="442" text-anchor="middle" font-size="12" font-weight="540" fill="#1a1a2e">actualAlarmList.Add</text>
  <text x="570" y="460" text-anchor="middle" font-size="11" fill="#6b6b80">→ 滚动报警文字</text>

  <path d="M 320 376 Q 240 395 150 420" fill="none" stroke="#9a9ab0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr-n)"/>
  <path d="M 360 376 L 360 420" fill="none" stroke="#9a9ab0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr-n)"/>
  <path d="M 400 376 Q 480 395 570 420" fill="none" stroke="#9a9ab0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr-n)"/>

  <text x="360" y="530" text-anchor="middle" font-size="11" fill="#6b6b80">关键解耦：通信线程只写不读 UI · storeTimer 只读不写设备 · 跨线程通过 Invoke / 事件回调</text>
</svg>