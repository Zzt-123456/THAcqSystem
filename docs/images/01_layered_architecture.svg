<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow-brand" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#7c5cff"/>
    </marker>
    <marker id="arrow-neutral" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#9a9ab0"/>
    </marker>
  </defs>
  <rect width="720" height="520" fill="#ffffff"/>

  <text x="24" y="92" font-size="12" font-weight="680" fill="#6b6b80" letter-spacing="1">UI 层</text>
  <text x="24" y="192" font-size="12" font-weight="680" fill="#6b6b80" letter-spacing="1">业务/控件/工具</text>
  <text x="24" y="292" font-size="12" font-weight="680" fill="#6b6b80" letter-spacing="1">数据访问</text>
  <text x="24" y="392" font-size="12" font-weight="680" fill="#6b6b80" letter-spacing="1">实体</text>

  <rect x="280" y="64" width="200" height="56" rx="8" fill="#f0ebff" stroke="#7c5cff" stroke-width="2"/>
  <text x="380" y="88" text-anchor="middle" font-size="14" font-weight="540" fill="#1a1a2e">ZZT.MTHProject</text>
  <text x="380" y="106" text-anchor="middle" font-size="11" fill="#6b6b80">主程序 · 12 个窗体 · 启动入口</text>

  <rect x="100" y="164" width="160" height="56" rx="8" fill="#ffffff" stroke="#e4e4ec" stroke-width="1.5"/>
  <text x="180" y="188" text-anchor="middle" font-size="14" font-weight="540" fill="#1a1a2e">ZZT.MTHBLL</text>
  <text x="180" y="206" text-anchor="middle" font-size="11" fill="#6b6b80">业务逻辑(薄封装)</text>

  <rect x="300" y="164" width="160" height="56" rx="8" fill="#ffffff" stroke="#e4e4ec" stroke-width="1.5"/>
  <text x="380" y="188" text-anchor="middle" font-size="14" font-weight="540" fill="#1a1a2e">ZZT.MTHControlLib</text>
  <text x="380" y="206" text-anchor="middle" font-size="11" fill="#6b6b80">10 个自定义控件</text>

  <rect x="500" y="164" width="160" height="56" rx="8" fill="#ffffff" stroke="#e4e4ec" stroke-width="1.5"/>
  <text x="580" y="188" text-anchor="middle" font-size="14" font-weight="540" fill="#1a1a2e">ZZT.MTHHelper</text>
  <text x="580" y="206" text-anchor="middle" font-size="11" fill="#6b6b80">Modbus/INI/JSON</text>

  <rect x="100" y="264" width="160" height="56" rx="8" fill="#ffffff" stroke="#e4e4ec" stroke-width="1.5"/>
  <text x="180" y="288" text-anchor="middle" font-size="14" font-weight="540" fill="#1a1a2e">ZZT.MTHDAL</text>
  <text x="180" y="306" text-anchor="middle" font-size="11" fill="#6b6b80">手写 ADO.NET · SQLHelper</text>

  <rect x="300" y="364" width="160" height="56" rx="8" fill="#f0ebff" stroke="#7c5cff" stroke-width="2"/>
  <text x="380" y="388" text-anchor="middle" font-size="14" font-weight="540" fill="#1a1a2e">ZZT.MTHModels</text>
  <text x="380" y="406" text-anchor="middle" font-size="11" fill="#6b6b80">实体/枚举 · 最底层基座</text>

  <path d="M 340 120 Q 260 140 200 164" fill="none" stroke="#7c5cff" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/>
  <path d="M 380 120 L 380 164" fill="none" stroke="#9a9ab0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-neutral)"/>
  <path d="M 420 120 Q 500 140 560 164" fill="none" stroke="#9a9ab0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-neutral)"/>
  <path d="M 180 220 L 180 264" fill="none" stroke="#7c5cff" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/>
  <path d="M 220 320 Q 300 345 340 364" fill="none" stroke="#7c5cff" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/>
  <path d="M 380 220 L 380 364" fill="none" stroke="#9a9ab0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-neutral)"/>

  <text x="540" y="300" font-size="11" fill="#6b6b80" text-anchor="start">↑ 紫色 = 主数据链</text>
  <text x="540" y="318" font-size="11" fill="#6b6b80" text-anchor="start">灰 = UI 支撑依赖</text>
  <text x="540" y="348" font-size="11" fill="#7c5cff" text-anchor="start">Helper 独立, 不引用 Models</text>

  <g font-size="12" fill="#6b6b80">
    <rect x="40" y="470" width="14" height="3" fill="#7c5cff" rx="2"/>
    <text x="60" y="476">主数据访问链 (UI→BLL→DAL→Models)</text>
    <rect x="330" y="470" width="14" height="3" fill="#9a9ab0" rx="2"/>
    <text x="350" y="476">UI 支撑依赖 (控件库/工具层)</text>
  </g>
</svg>