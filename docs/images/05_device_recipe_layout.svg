<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr-h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#7c5cff"/>
    </marker>
  </defs>
  <rect width="720" height="600" fill="#ffffff"/>

  <text x="20" y="28" font-size="13" font-weight="680" fill="#1a1a2e">配置层级 (Excel 持久化)</text>

  <rect x="20" y="44" width="300" height="100" rx="8" fill="#f0ebff" stroke="#7c5cff" stroke-width="1.8"/>
  <text x="36" y="64" font-size="13" font-weight="680" fill="#1a1a2e">Device (设备)</text>
  <text x="36" y="82" font-size="11" fill="#6b6b80">IPAddress · Port · CurrentRecipe</text>
  <text x="36" y="98" font-size="11" fill="#6b6b80">ReConnectTime · ReConnectSign</text>
  <text x="36" y="114" font-size="11" fill="#00a3a3" font-style="italic">IsConnected · CurrentValue Dict · AlarmTrigEvent</text>
  <text x="36" y="132" font-size="11" fill="#6b6b80">GroupList: List&lt;Group&gt;</text>

  <rect x="20" y="172" width="300" height="84" rx="8" fill="#e6fffa" stroke="#00a3a3" stroke-width="1.8"/>
  <text x="36" y="192" font-size="13" font-weight="680" fill="#1a1a2e">Group (通讯组 · 批量读取最小单位)</text>
  <text x="36" y="210" font-size="11" fill="#6b6b80">GroupName · Start · Length · StoreArea</text>
  <text x="36" y="226" font-size="11" fill="#6b6b80">StoreArea: 输入线圈/输出线圈/输入寄存器/保持寄存器</text>
  <text x="36" y="246" font-size="11" fill="#00a3a3" font-style="italic">VarList: List&lt;Variable&gt; (运行时构建)</text>

  <rect x="20" y="284" width="300" height="124" rx="8" fill="#ffffff" stroke="#e4e4ec" stroke-width="1.5"/>
  <text x="36" y="304" font-size="13" font-weight="680" fill="#1a1a2e">Variable (变量 · 按偏移解析)</text>
  <text x="36" y="322" font-size="11" fill="#6b6b80">VarName · Start · DataType · OffsetOrLength</text>
  <text x="36" y="338" font-size="11" fill="#6b6b80">GroupName (外键→Group) · Remark</text>
  <text x="36" y="354" font-size="11" fill="#6b6b80">Scale · Offset (实际值=原始×Scale+Offset)</text>
  <text x="36" y="370" font-size="11" fill="#6b6b80">PosAlarm · NegAlarm (上升/下降沿报警)</text>
  <text x="36" y="388" font-size="11" fill="#00a3a3" font-style="italic">VarValue · PosCacheValue · NegCacheValue</text>
  <text x="36" y="402" font-size="11" fill="#00a3a3" font-style="italic">DataType: Bool/Short/Int/Float/String/...</text>

  <path d="M 170 144 L 170 172" fill="none" stroke="#7c5cff" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-h)"/>
  <path d="M 170 256 L 170 284" fill="none" stroke="#7c5cff" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-h)"/>

  <text x="20" y="432" font-size="11" fill="#6b6b80">关联: Variable.GroupName → Group.GroupName (多对一)</text>
  <text x="20" y="450" font-size="11" fill="#6b6b80">加载时按 GroupName 将 Variable 挂到 Group.VarList</text>

  <text x="360" y="28" font-size="13" font-weight="680" fill="#1a1a2e">配方应用寄存器布局 (从地址 36 起, 60 个 short)</text>

  <g transform="translate(360, 48)">
    <rect x="0" y="0" width="120" height="32" fill="#7c5cff" rx="2"/>
    <text x="60" y="20" text-anchor="middle" font-size="11" font-weight="680" fill="#ffffff">[36-59] 24 限值</text>
    <rect x="122" y="0" width="120" height="32" fill="#e4e4ec" rx="2"/>
    <text x="182" y="20" text-anchor="middle" font-size="11" font-weight="680" fill="#6b6b80">[60-83] 24 占位</text>
    <rect x="244" y="0" width="60" height="32" fill="#00a3a3" rx="2"/>
    <text x="274" y="20" text-anchor="middle" font-size="11" font-weight="680" fill="#ffffff">[84-95] 12 启用</text>
  </g>

  <rect x="360" y="100" width="304" height="92" rx="8" fill="#f0ebff" stroke="#7c5cff" stroke-width="1.5"/>
  <text x="376" y="120" font-size="13" font-weight="680" fill="#1a1a2e">① 限值段 [36-59] · 24 个 short</text>
  <text x="376" y="140" font-size="11" fill="#6b6b80">6 站点 × (温度高限/低限 + 湿度高限/低限)</text>
  <text x="376" y="158" font-size="11" fill="#6b6b80">数值 ×10 取整 (85.0℃ → 850)</text>
  <text x="376" y="176" font-size="11" fill="#6b6b80">ByteArrayLib.GetByteArrayFromShortArray</text>

  <rect x="360" y="204" width="304" height="60" rx="8" fill="#ffffff" stroke="#e4e4ec" stroke-width="1.5"/>
  <text x="376" y="224" font-size="13" font-weight="680" fill="#1a1a2e">② 占位段 [60-83] · 24 个 0</text>
  <text x="376" y="244" font-size="11" fill="#6b6b80">保持地址偏移对齐 (空闲寄存器)</text>
  <text x="376" y="260" font-size="11" fill="#6b6b80">values.AddRange(Enumerable.Repeat(0,24))</text>

  <rect x="360" y="276" width="304" height="76" rx="8" fill="#e6fffa" stroke="#00a3a3" stroke-width="1.5"/>
  <text x="376" y="296" font-size="13" font-weight="680" fill="#1a1a2e">③ 启用段 [84-95] · 12 个 short</text>
  <text x="376" y="316" font-size="11" fill="#6b6b80">6 站点 × (温度报警启用 + 湿度报警启用)</text>
  <text x="376" y="334" font-size="11" fill="#6b6b80">bool → 1/0 整数</text>

  <rect x="360" y="372" width="304" height="100" rx="8" fill="#ffffff" stroke="#e4e4ec" stroke-width="1.5"/>
  <text x="376" y="392" font-size="13" font-weight="680" fill="#1a1a2e">应用流程 (FrmRecipe.btn_Apply_Click)</text>
  <text x="376" y="412" font-size="11" fill="#6b6b80">1. 校验配方参数数量 = 6</text>
  <text x="376" y="430" font-size="11" fill="#6b6b80">2. 构建 60 个 short 列表</text>
  <text x="376" y="448" font-size="11" fill="#6b6b80">3. PreSetMultiRegisters(36, bytes)</text>
  <text x="376" y="466" font-size="11" fill="#6b6b80">4. 写入 Device.ini 记录当前配方</text>

  <path d="M 512 132 L 512 100" fill="none" stroke="#7c5cff" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr-h)"/>
  <path d="M 512 196 L 512 204" fill="none" stroke="#9a9ab0" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 512 264 L 512 276" fill="none" stroke="#9a9ab0" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 512 352 L 512 372" fill="none" stroke="#9a9ab0" stroke-width="1.5" stroke-linecap="round"/>

  <text x="360" y="500" font-size="11" fill="#6b6b80">写成功后 Device.CurrentRecipe 同步更新, UI 显示当前配方名</text>
  <text x="360" y="520" font-size="11" fill="#6b6b80">配方本身以 JSON 序列化存于 Recipe/&lt;name&gt;.ini</text>
</svg>